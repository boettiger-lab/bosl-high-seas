# bosl-high-seas on the local k3s cluster (cirrus).
#
# Derived from deployment.yaml (NRP) but retargeted at the self-hosted cluster:
#   - namespace `high-seas`, pinned to the cirrus node
#   - the initContainer copies layers-input.cirrus.json over layers-input.json,
#     so the browser reads STAC/parquet/pmtiles from the in-cluster MinIO mirror
#     (minio.carlboettiger.info) and queries duckdb-mcp.carlboettiger.info
#   - PROXY_KEY comes from the vllm-api-key secret (see AGENTS.md for the
#     one-time copy from the vllm namespace), not open-llm-proxy-secrets
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bosl-high-seas
  namespace: high-seas
  labels:
    app: bosl-high-seas
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: bosl-high-seas
  template:
    metadata:
      labels:
        app: bosl-high-seas
    spec:
      # Pin to cirrus: thelio is the only other node and is currently
      # NotReady/SchedulingDisabled, and MinIO + Traefik both live on cirrus.
      nodeSelector:
        kubernetes.io/hostname: cirrus
      initContainers:
      - name: git-clone
        image: alpine/git:2.52.0
        command:
        - sh
        - -c
        - |
          git clone --depth 1 https://github.com/boettiger-lab/bosl-high-seas.git /tmp/repo
          cp /tmp/repo/index.html /usr/share/nginx/html/
          cp /tmp/repo/docs.html /usr/share/nginx/html/
          # Cirrus variant: same layer definitions, MinIO-mirror URLs.
          cp /tmp/repo/layers-input.cirrus.json /usr/share/nginx/html/layers-input.json
          cp /tmp/repo/system-prompt.md /usr/share/nginx/html/
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        env:
        - name: TMPDIR
          value: "/tmp"
        - name: MCP_SERVER_URL
          value: "https://duckdb-mcp.carlboettiger.info/mcp"
        # Self-hosted vLLM API key, injected into the /api/llm/ Authorization
        # header by nginx. Secrets can't be read across namespaces, so this is a
        # copy of vllm/vllm-api-key living in the high-seas namespace.
        - name: PROXY_KEY
          valueFrom:
            secretKeyRef:
              name: vllm-api-key
              key: api-key
              optional: true
        command:
        - sh
        - -c
        - |
          apk add --no-cache gettext
          # Client-side config: no LLM secrets (MCP_SERVER_URL only).
          envsubst '$${MCP_SERVER_URL}' \
            < /config/config.template.json \
            > /usr/share/nginx/html/config.json
          # Server-side nginx config: substitutes ${PROXY_KEY} into the
          # /api/llm/ reverse proxy's Authorization header. Limited to
          # ${PROXY_KEY} so nginx's own $uri / $remote_addr variables
          # are preserved.
          envsubst '$${PROXY_KEY}' < /nginx-template/nginx.conf.template \
            > /etc/nginx/conf.d/default.conf
          # Pin worker_processes low: the base image defaults to
          # 'auto' (one worker per CPU), which spawns 128 workers on
          # cirrus and OOM-kills the 256Mi limit. -g can't override it
          # (duplicate directive), so patch the main config in place.
          sed -i 's/^worker_processes.*/worker_processes 2;/' /etc/nginx/nginx.conf
          nginx -g 'daemon off;'
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        - name: nginx-template
          mountPath: /nginx-template
          readOnly: true
        - name: nginx-conf-d
          mountPath: /etc/nginx/conf.d
        - name: config-template
          mountPath: /config
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: website-content
        emptyDir: {}
      - name: config-template
        configMap:
          name: bosl-high-seas-config
      - name: nginx-template
        configMap:
          name: bosl-high-seas-nginx
      - name: nginx-conf-d
        emptyDir: {}
