apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>BOSL High Seas Explorer</title>

        <script type="importmap">
        {
            "imports": {
                "@modelcontextprotocol/sdk/client/index.js": "https://esm.sh/@modelcontextprotocol/sdk@1.12.0/client/index",
                "@modelcontextprotocol/sdk/client/streamableHttp.js": "https://esm.sh/@modelcontextprotocol/sdk@1.12.0/client/streamableHttp"
            }
        }
        </script>

        <!-- MapLibre GL JS -->
        <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
        <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

        <!-- PMTiles protocol -->
        <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>

        <!-- h3-js (for hex grid overlay) -->
        <script src="https://unpkg.com/h3-js@4.1.0/dist/h3-js.umd.js"></script>

        <!-- Markdown rendering -->
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

        <!-- Code highlighting -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>

        <!-- Core styles from CDN -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/boettiger-lab/geo-agent@main/app/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/boettiger-lab/geo-agent@main/app/chat.css">
    </head>

    <body>
        <!-- Map -->
        <div id="map"></div>

        <!-- Layer controls -->
        <div id="menu">
            <div class="menu-header">
                <label class="section-title">Layers</label>
                <button id="menu-toggle" title="Toggle layers">−</button>
            </div>
            <div id="menu-body">
                <div class="menu-section">
                    <label class="section-title">Basemap</label>
                    <div class="basemap-toggle-group">
                        <button class="basemap-btn"        data-basemap="natgeo"    onclick="window._setBasemap('natgeo')">NatGeo</button>
                        <button class="basemap-btn"         data-basemap="satellite" onclick="window._setBasemap('satellite')">Satellite</button>
                        <button class="basemap-btn"         data-basemap="plain"     onclick="window._setBasemap('plain')">Plain</button>
                    </div>
                </div>
                <div class="menu-section">
                    <label class="section-title">Overlays</label>
                    <div id="layer-controls-container" class="checkbox-group">
                        <!-- Generated by MapManager -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat interface -->
        <div id="chat-container">
            <div id="chat-header">
                <h3>Data Assistant</h3>
                <button id="chat-toggle" title="Toggle chat">−</button>
            </div>
            <div id="chat-messages"></div>
            <div id="chat-input-container">
                <input type="text" id="chat-input" placeholder="Ask about the data…" autocomplete="off">
                <button id="chat-send">Send</button>
            </div>
            <div id="chat-footer">
                <select id="model-selector" title="Select model"></select>
            </div>
        </div>

        <!-- Boot from CDN -->
        <script type="module" src="https://cdn.jsdelivr.net/gh/boettiger-lab/geo-agent@main/app/main.js"></script>
    </body>

    </html>
  layers-input.json: |
    {
        "catalog": "https://s3-west.nrp-nautilus.io/public-data/stac/catalog.json",
        "titiler_url": "https://titiler.nrp-nautilus.io",
        "mcp_url": "https://duckdb-mcp.nrp-nautilus.io/mcp",
        "view": {
            "center": [0, 0],
            "zoom": 2
        },
        "default_basemap": "natgeo",
        "custom_basemap": {
            "url": "https://services.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}",
            "label": "Ocean"
        },
        "llm": {
            "user_provided": true,
            "default_endpoint": "https://openrouter.ai/api/v1",
            "models": [
                {
                    "value": "qwen/qwen3-235b-a22b",
                    "label": "Qwen3 235B"
                },
                {
                    "value": "moonshotai/kimi-k2",
                    "label": "Kimi K2"
                },
                {
                    "value": "minimax/minimax-m1",
                    "label": "MiniMax M1"
                },
                {
                    "value": "anthropic/claude-sonnet-4",
                    "label": "Claude Sonnet"
                },
                {
                    "value": "google/gemini-2.5-flash",
                    "label": "Gemini Flash"
                }
            ]
        },
        "welcome": {
            "message": "Hi! I can help you explore high seas and marine protected area data. Try asking:",
            "examples": [
                "Tell me about the datasets you have access to.",
                "Show only marine protected areas on the map.",
                "How has total global fishing effort changed from 2012 to 2024?",
                "Which IUCN protection categories have the most fishing activity inside their marine boundaries in 2024?"
            ]
        },
        "collections": [
            {
                "collection_id": "iho-maritime-boundaries",
                "collection_url": "https://s3-west.nrp-nautilus.io/public-high-seas/iho/stac-collection.json",
                "assets": [
                    {
                        "id": "eez-pmtiles",
                        "display_name": "Exclusive Economic Zones (EEZ)",
                        "group": "Maritime Boundaries",
                        "visible": false,
                        "default_style": {
                            "fill-color": "rgba(0,0,0,0)",
                            "fill-opacity": 0
                        },
                        "outline_style": {
                            "line-color": "#F57F17",
                            "line-width": 1
                        },
                        "tooltip_fields": ["GEONAME", "SOVEREIGN1", "ISO_SOV1", "TERRITORY1", "POL_TYPE", "AREA_KM2"]
                    },
                    {
                        "id": "high-seas-pmtiles",
                        "display_name": "High Seas (ABNJ)",
                        "group": "Maritime Boundaries",
                        "visible": true,
                        "default_style": {
                            "fill-color": "#1565C0",
                            "fill-opacity": 0.15
                        },
                        "outline_style": {
                            "line-color": "#1565C0",
                            "line-width": 0.5
                        },
                        "tooltip_fields": ["name", "mrgid", "area_km2"]
                    }
                ]
            },
            {
                "collection_id": "wdpa-december-2025",
                "assets": [
                    {
                        "id": "wdpa-pmtiles",
                        "display_name": "All Protected Areas",
                        "group": "Protected Areas",
                        "visible": false,
                        "default_style": {
                            "fill-color": [
                                "match",
                                ["get", "REALM"],
                                "Marine", "#1565C0",
                                "Coastal", "#26A69A",
                                "Terrestrial", "#4CAF50",
                                "#888888"
                            ],
                            "fill-opacity": 0.5
                        },
                        "tooltip_fields": [
                            "NAME_ENG",
                            "DESIG_ENG",
                            "IUCN_CAT",
                            "REALM",
                            "GIS_AREA",
                            "STATUS"
                        ]
                    },
                    {
                        "id": "wdpa-pmtiles",
                        "alias": "wdpa-marine",
                        "display_name": "Marine Protected Areas",
                        "group": "Protected Areas",
                        "visible": true,
                        "default_style": {
                            "fill-color": [
                                "match",
                                ["get", "IUCN_CAT"],
                                "Ia", "#0D47A1",
                                "Ib", "#1565C0",
                                "II", "#1976D2",
                                "III", "#1E88E5",
                                "IV", "#42A5F5",
                                "V", "#64B5F6",
                                "VI", "#90CAF9",
                                "#B0BEC5"
                            ],
                            "fill-opacity": 0.6
                        },
                        "default_filter": [
                            "match",
                            ["get", "REALM"],
                            ["Marine", "Coastal"],
                            true,
                            false
                        ],
                        "tooltip_fields": [
                            "NAME_ENG",
                            "DESIG_ENG",
                            "IUCN_CAT",
                            "NO_TAKE",
                            "GIS_M_AREA",
                            "STATUS"
                        ]
                    }
                ]
            },
            {
                "collection_id": "gfw-fishing-effort",
                "collection_url": "https://s3-west.nrp-nautilus.io/public-gfw/stac-collection.json"
            }
        ]
    }
  system-prompt.md: |
    # High Seas & Marine Protected Areas Analyst

    You are a geospatial data analyst specializing in high seas governance, marine protected areas, and ocean conservation.
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: bosl-high-seas-content
  namespace: biodiversity
