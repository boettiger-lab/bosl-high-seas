# The private deployment's ConfigMaps, written by hand (the public one is k8s/configmap.yaml).
# LLM config template — NO LLM SECRETS.
#
# The PROXY_KEY lives only in the nginx config (see `bosl-high-seas-nginx`
# below), which injects the Authorization header server-side via
# `proxy_set_header`. The browser only sees a relative `/api/llm` endpoint
# and never holds the key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bosl-high-seas-private-config
  namespace: schmidtdse
data:
  config.template.json: |
    {
        "mcp_server_url": "${MCP_SERVER_URL}",
        "llm_model": "deepseek-v4-flash",
        "llm_models": [
            {
                "value": "deepseek-v4-flash",
                "label": "NRP DeepSeek V4 Flash",
                "endpoint": "/api/llm",
                "api_key": "${APP_TOKEN}"
            },
            {
                "value": "xiaomi/mimo-v2.6-pro",
                "label": "MiMo V2.6 Pro (OpenRouter)",
                "endpoint": "/api/llm",
                "api_key": "${APP_TOKEN}"
            },
            {
                "value": "xiaomi/mimo-v2.6-flash",
                "label": "MiMo V2.6 Flash (OpenRouter)",
                "endpoint": "/api/llm",
                "api_key": "${APP_TOKEN}"
            },
            {
                "value": "z-ai/glm-5.2",
                "label": "GLM-5.2 (OpenRouter)",
                "endpoint": "/api/llm",
                "api_key": "${APP_TOKEN}"
            },
            {
                "value": "~deepseek/deepseek-v4-flash-latest",
                "label": "DeepSeek V4 Flash Latest (OpenRouter)",
                "endpoint": "/api/llm",
                "api_key": "${APP_TOKEN}"
            },
            {
                "value": "qwen",
                "label": "DSE-nimbus",
                "endpoint": "/api/llm",
                "api_key": "${APP_TOKEN}"
            },
            {
                "value": "qwen3",
                "label": "NRP Qwen3",
                "endpoint": "/api/llm",
