---
# Nginx configuration. The shared parts (limits, chat, MCP, tiles, the page and
# the health check) are the snippets in nginx/ of SchmidtDSE/glen-template at the
# tag the Deployment clones, filled in from its env at start-up (glen-ops#340).
# Only this app's own routes belong here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bosl-high-seas-private-nginx
  namespace: schmidtdse
data:
  nginx.conf.template: |
    include /etc/nginx/glen/limits.conf;

    server {
        listen 80;
        server_name _;

        # Private deployment (#85): HTTP basic auth on everything except /health
        # (probes) and /api/llm/, which checks APP_TOKEN instead. The htpasswd file
        # comes from the bosl-high-seas-private-htpasswd Secret and is never committed.
        include /etc/nginx/glen/auth-basic.conf;
        include /etc/nginx/glen/base.conf;
        include /etc/nginx/glen/llm-token.conf;
        include /etc/nginx/glen/mcp.conf;
        include /etc/nginx/glen/spa.conf;

        # Literature corpus (text-query prototype): the in-cluster server reads the
        # private corpus bucket, so it is reachable only behind this password.
        location /api/text-query/ {
            proxy_pass http://high-seas-text-query.schmidtdse.svc.cluster.local:8000/;
            proxy_set_header Authorization "Bearer ${TEXT_QUERY_TOKEN}";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }
    }
