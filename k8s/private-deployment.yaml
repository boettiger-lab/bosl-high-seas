# The private deployment's Deployment, written by hand (the public one is k8s/deployment.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bosl-high-seas-private
  namespace: schmidtdse
  labels:
    app: bosl-high-seas-private
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: bosl-high-seas-private
  template:
    metadata:
      labels:
        app: bosl-high-seas-private
    spec:
      initContainers:
      - name: git-clone
        image: alpine/git:2.52.0
        command:
        - sh
        - -c
        - |
          git clone --depth 1 https://github.com/boettiger-lab/bosl-high-seas.git /tmp/repo
          cp /tmp/repo/index.html /usr/share/nginx/html/
          cp /tmp/repo/docs.html /usr/share/nginx/html/
          cp /tmp/repo/bosl-logo.svg /usr/share/nginx/html/
          cp /tmp/repo/layers-input.private.json /usr/share/nginx/html/layers-input.json
          cp /tmp/repo/system-prompt.private.md /usr/share/nginx/html/system-prompt.md
          # EBSA explorer (glen-charts): page, theme, config and precomputed data
          cp -r /tmp/repo/explorer /usr/share/nginx/html/
          # The shared nginx snippets (glen-ops#340), pinned like the GLEN version.
          git clone --depth 1 --branch nginx-v4 https://github.com/SchmidtDSE/glen-template.git /tmp/glen
          cp /tmp/glen/nginx/* /glen-nginx/
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        - name: glen-nginx
          mountPath: /glen-nginx
      containers:
      - name: nginx
        image: nginx:1.31.9-alpine
        ports:
        - containerPort: 80
        env:
        - name: TMPDIR
          value: "/tmp"
        # Per-app values for the shared nginx snippets (glen-template nginx/render.sh).
        - name: GLEN_APP
          value: "bosl-high-seas-private"
        - name: AUTH_REALM
          value: "High Seas Explorer (private)"
        - name: LLM_UPSTREAM
          value: "http://open-llm-proxy.schmidtdse.svc.cluster.local:8002"
        - name: MCP_UPSTREAM
          value: "http://duckdb-mcp.schmidtdse.svc.cluster.local:8000"
        - name: MCP_HOST
          value: "duckdb-mcp.schmidtdse.svc.cluster.local"
        - name: APP_NGINX_VARS
          value: '${TEXT_QUERY_TOKEN}'
        - name: CONFIG_JSON_VARS
          value: '${APP_TOKEN}'
        # Same-origin MCP path: nginx proxies it to the shared server and
        # attaches the bearer token, so the browser never holds the token
        # (geo-query#453). Absolute, because GLEN does new URL(mcp_url).
        - name: MCP_SERVER_URL
          value: "https://high-seas-private.nrp-nautilus.io/api/mcp"
        - name: MCP_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: duckdb-mcp-tokens
              key: bosl-high-seas-private
        # Bearer for the in-cluster text-query server, attached by nginx on
        # /api/text-query/ so the browser never holds it.
        - name: TEXT_QUERY_TOKEN
          valueFrom:
            secretKeyRef:
              name: high-seas-text-query-auth
              key: token
        - name: PROXY_KEY
          valueFrom:
            secretKeyRef:
              name: open-llm-proxy-namespace-keys
              key: private
              optional: true
        # Renders the shared snippets and this app's server block, writes
        # config.json, and starts nginx.
        command: ["sh", "/glen-nginx/render.sh"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        - name: nginx-template
          mountPath: /nginx-template
          readOnly: true
        - name: nginx-conf-d
          mountPath: /etc/nginx/conf.d
        - name: glen-nginx
          mountPath: /glen-nginx
          readOnly: true
        - name: config-template
          mountPath: /config
        - name: htpasswd
          mountPath: /etc/nginx/auth
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: website-content
        emptyDir: {}
      - name: config-template
        configMap:
          name: bosl-high-seas-private-config
      - name: nginx-template
        configMap:
          name: bosl-high-seas-private-nginx
      - name: nginx-conf-d
        emptyDir: {}
      - name: glen-nginx
        emptyDir: {}
      - name: htpasswd
        secret:
          secretName: bosl-high-seas-private-htpasswd
